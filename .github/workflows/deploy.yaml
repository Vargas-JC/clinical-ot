name: Java CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar
        run: mvn clean verify

      - name: Ejecutar Tests
        run: mvn test

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=vargas-jc \
            -Dsonar.organization=Vargas-JC \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN

        #Docker
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Tu usuario guardado de forma segura en GitHub
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # Tu token de Docker Hub

      - name: Construir y Subir Imagen de Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jcvargasdev/hubble:latest # El nombre que tendrá tu imagen
