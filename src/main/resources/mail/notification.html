<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title th:text="${title}">El Otorogo</title>
</head>
<body style="margin:0;padding:24px;background-color:#f7fafc;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;border-spacing:0;max-width:560px;margin:0 auto;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(29,78,216,0.12);">
    <tbody>
    <tr>
      <td align="center" style="padding:28px 28px 8px;text-align:center;background:linear-gradient(135deg,#1d4ed8,#3b82f6);">
        <img src="cid:logo" alt="El Otorogo" width="132" height="48" style="display:block;margin:0 auto;border:0;outline:none;text-decoration:none;">
      </td>
    </tr>
    <tr>
      <td style="padding:8px 28px 28px;">
        <h1 style="margin:16px 0 12px;font-size:20px;color:#1a202c;" th:text="${title}">Título</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#2d3748;" th:text="${message}">Mensaje</p>
        <p style="margin:28px 0 0;font-size:12px;color:#64748b;">El Otorogo · oftalmología</p>
      </td>
    </tr>
    </tbody>
  </table>
</body>
</html>
