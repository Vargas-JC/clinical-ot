<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title th:text="${title}">El Otorogo</title>
</head>
<body style="margin:0;padding:24px;background-color:#f7fafc;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;border-spacing:0;max-width:560px;margin:0 auto;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(29,78,216,0.12);">
    <tbody>
    <tr>
      <td align="center" style="padding:28px 28px 8px;text-align:center;background:linear-gradient(135deg,#1d4ed8,#3b82f6);">
        <img src="cid:logo" alt="El Otorogo" width="132" height="48" style="display:block;margin:0 auto;border:0;outline:none;text-decoration:none;">
      </td>
    </tr>
    <tr>
      <td style="padding:8px 28px 28px;">
        <h1 style="margin:16px 0 12px;font-size:20px;color:#1a202c;" th:text="${title}">Recuperación</h1>
        <p style="margin:0 0 16px;font-size:15px;line-height:1.55;color:#2d3748;">Hola <span th:text="${userName}">Usuario</span>.</p>
        <p style="margin:0 0 16px;font-size:15px;line-height:1.55;color:#2d3748;">Tu código de verificación (válido <span th:text="${validityMinutes}">60</span> minutos) es:</p>
        <p style="margin:0 0 20px;padding:18px 20px;background-color:#edf2f7;border-radius:8px;font-family:Consolas,monospace;font-size:28px;letter-spacing:0.35em;text-align:center;color:#1a202c;" th:text="${otpCode}">000000</p>
        <p style="margin:0;font-size:12px;color:#a0aec0;">Si no solicitaste el cambio, ignora este mensaje.</p>
      </td>
    </tr>
    </tbody>
  </table>
</body>
</html>
